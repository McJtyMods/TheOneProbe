buildscript {
    repositories {
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.hypherionmc.modutils:modpublisher:2.2.1'
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'fabric-loom' version '1.10.5'
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'

def localGradleTools = [
        project.findProperty('gradletools_path') ? file(project.property('gradletools_path')) : null,
        rootProject.file('gradletools.gradle'),
        file('../Multi_fabric/gradletools.gradle'),
        file('../gradletools.gradle'),
        file('gradletools.gradle')
].find { it != null && it.isFile() }
apply from: localGradleTools ?: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkspace/1.21_fabric/gradletools.gradle'

group = 'mcjty.theoneprobe'
base.archivesName = 'theoneprobe'
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
if (System.getenv('BUILD_NUMBER') != null) {
    version += "-${System.getenv('BUILD_NUMBER')}"
}
sourceSets.main.resources.srcDir 'src/generated/resources'
repos()
access()
runs()
jars()
dependencies {
    mc()
    config()
    energy()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    manifest {
        attributes([
                "Specification-Title"      : project.mod_id,
                "Specification-Vendor"     : 'McJty',
                "Specification-Version"    : "1",
                "Implementation-Title"     : project.name,
                "Implementation-Version"   : project.jar.archiveVersion,
                "Implementation-Vendor"    : 'McJty',
                "Implementation-Timestamp" : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

task apiJar(type: Jar) {
    archiveClassifier = "api"
    from(sourceSets.main.output) {
        include "mcjty/theoneprobe/api/**"
    }
}

artifacts {
    archives apiJar
}

modpublisher([], ['fabric-api', 'forge-config-api-port'], [], ['fabric-api', 'forge-config-api-port'], [])

publishing {
    publications.create('mavenJava', MavenPublication) {
        from components.java
        artifact apiJar

        artifactId = base.archivesName.get()
        pom {
            name = 'TheOneProbe'
            description = 'What am I looking at?'
            scm {
                url = 'https://github.com/McJtyMods/TheOneProbe'
                connection = 'scm:git:git@github.com:McJtyMods/TheOneProbe.git'
                developerConnection = 'scm:git:git@github.com:McJtyMods/TheOneProbe.git'
            }
            issueManagement {
                system = 'github'
                url = 'https://github.com/McJtyMods/TheOneProbe/issues'
            }
            licenses {
                license {
                    name = 'MIT'
                    distribution = 'repo'
                }
            }
            developers {
                developer {
                    id = 'McJty'
                    name = 'McJty'
                    roles = ['developer']
                }
            }
        }
    }
    repositories {
        if (System.getenv('local_maven') != null) {
            maven {
                name = 'local'
                url = 'file://' + System.getenv('local_maven')
            }
        }
    }
}
