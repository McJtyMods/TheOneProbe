buildscript {
    repositories {
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.hypherionmc.modutils:modpublisher:2.2.1'
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'

group= "mcjty.theoneprobe" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
base.archivesName = "theoneprobe"
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

if (System.getenv('BUILD_NUMBER') != null) {
    version += "-${System.getenv('BUILD_NUMBER')}"
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenLocal()
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}"
    include(implementation('teamreborn:energy:5.0.0'))
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

loom {
    accessWidenerPath = file('src/main/resources/theoneprobe.accesswidener')
    runs { server { programArg '--nogui' } }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    manifest {
        attributes([
                "Specification-Title"      : project.mod_id,
                "Specification-Vendor"     : 'McJty',
                "Specification-Version"    : "1",
                "Implementation-Title"     : project.name,
                "Implementation-Version"   : project.jar.archiveVersion,
                "Implementation-Vendor"    : 'McJty',
                "Implementation-Timestamp" : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

task apiJar(type: Jar) {
    archiveClassifier = "api"
    from(sourceSets.main.output) {
        include "mcjty/theoneprobe/api/**"
    }
}

artifacts {
    archives apiJar
}

def getPublishChangelog = {
    def changelogOverride = System.getenv('CHANGELOG')
    if (changelogOverride != null && changelogOverride != 'none') {
        return changelogOverride
    }

    def changelogFile = file('changelog.txt')
    if (!changelogFile.exists()) {
        throw new GradleException('Cannot publish without changelog.txt or a CHANGELOG environment variable')
    }

    StringBuilder changelog = new StringBuilder()
    int lineCount = 0
    boolean done = false
    changelogFile.eachLine { line ->
        if (done) {
            return
        }
        if (line.size() <= 1) {
            done = true
            return
        }

        def formatted = line
        if (lineCount == 0) {
            formatted = "## ${mod_name} ${version}"
        } else if (!line.startsWith('-')) {
            formatted = "#### ${line}"
        } else {
            formatted = formatted.replaceAll("(\\S+\\/\\S+)#([0-9]+)\\b", "[\$0](https://github.com/\$1/issues/\$2)")
            formatted = formatted.replaceAll("#([0-9]+)\\b", "[\$0](https://github.com/${github_project}/issues/\$1)")
        }
        changelog.append(formatted).append('\n')
        lineCount++
    }
    changelog.toString()
}

def curseKey = (project.findProperty('curseforge_key') ?: System.getenv('CURSEFORGE_TOKEN') ?: System.getenv('CURSE_TOKEN') ?: '').toString()
def modrinthKey = (project.findProperty('modrinth_token') ?: System.getenv('MODRINTH_TOKEN') ?: '').toString()
def publishArtifactTask = tasks.findByName('reobfJar') ?: tasks.findByName('jar')

tasks.named('publishCurseforge') {
    enabled = !curseKey.isEmpty()
    dependsOn publishArtifactTask
}

tasks.named('publishModrinth') {
    enabled = !modrinthKey.isEmpty() && project.hasProperty('modrinthId')
    dependsOn publishArtifactTask
}

tasks.named('publishMod') {
    dependsOn publishArtifactTask
    doFirst {
        if (curseKey.isEmpty() && modrinthKey.isEmpty()) {
            throw new GradleException('No publishing credentials found. Set CURSEFORGE_TOKEN (or CURSE_TOKEN) and/or MODRINTH_TOKEN.')
        }
    }
}

['publishGitHub', 'publishNightbloom', 'publishModtale'].each { taskName ->
    def publishTask = tasks.findByName(taskName)
    if (publishTask != null) {
        publishTask.enabled = false
    }
}

publisher {
    apiKeys {
        curseforge curseKey
        modrinth modrinthKey
    }

    curseID.set(project.projectId.toString())
    modrinthID.set(project.modrinthId.toString())
    versionType.set(project.curse_type.toString())
    changelog.set({ getPublishChangelog.call() })
    projectVersion.set(project.version.toString())
    displayName.set("${mod_name} - ${project.version}")
    gameVersions.set([project.minecraft_version.toString()])
    loaders.set(['fabric'])
    curseEnvironment.set('both')
    javaVersions.add(JavaVersion.VERSION_25)
    artifact.set(jar)
}

publishing {
    publications.create('mavenJava', MavenPublication) {
        from components.java
        artifact apiJar

        artifactId = base.archivesName.get()
        pom {
            name = 'TheOneProbe'
            description = 'What am I looking at?'
            scm {
                url = 'https://github.com/McJtyMods/TheOneProbe'
                connection = 'scm:git:git@github.com:McJtyMods/TheOneProbe.git'
                developerConnection = 'scm:git:git@github.com:McJtyMods/TheOneProbe.git'
            }
            issueManagement {
                system = 'github'
                url = 'https://github.com/McJtyMods/TheOneProbe/issues'
            }
            licenses {
                license {
                    name = 'MIT'
                    distribution = 'repo'
                }
            }
            developers {
                developer {
                    id = 'McJty'
                    name = 'McJty'
                    roles = ['developer']
                }
            }
        }
    }
    repositories {
        if (System.getenv('local_maven') != null) {
            maven {
                name = 'local'
                url = 'file://' + System.getenv('local_maven')
            }
        }
    }
}

fabricApi.configureTests {
    createSourceSet = true
    modId = 'theoneprobe_test'
    enableGameTests = false
}
